name: Refresh Season Snowfall
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch: {}
concurrency:
  group: resort-data-updates
  cancel-in-progress: false
jobs:
  snowfall:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh current totals and resume historical backfill
        # Reserve free-tier request capacity for hourly current weather collection.
        run: python3 scripts/fetch_resort_snowfall.py --backfill-budget 1200
      - name: Commit snowfall checkpoints
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resort-snowfall.json
          git diff --cached --quiet || git commit -m "chore: refresh ERA5 snowfall totals"
          git push
