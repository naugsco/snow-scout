name: Fetch Resort Data
on:
  schedule:
    - cron: '17 * * * *'  # Northern and southern ski seasons
  workflow_dispatch: {}
concurrency:
  group: resort-data-updates
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/conditions.test.mjs tests/source-repair.test.mjs
      - run: node scripts/fetch_resort_forecasts.mjs
      - run: node scripts/fetch_resort_conditions.mjs
      - run: node scripts/audit_resort_sources.mjs
      - run: node --test tests/data-snapshots.test.mjs
      - name: Preserve source health evidence
        uses: actions/upload-artifact@v4
        with:
          name: resort-source-health
          path: data/resort-source-health.json
          retention-days: 7
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resort-conditions.json data/resort-forecasts.json data/resort-source-health.json
          git diff --cached --quiet || git commit -m "chore: update resort data"
          git push
